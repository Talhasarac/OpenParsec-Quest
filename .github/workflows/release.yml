name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # GitHub deprecated Node.js 20 actions; this opts each step into Node 24
  # so we don't get warning spam on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew exec permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: rename
        run: |
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-release.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi
          output="dist/openparsec-quest2-${{ github.ref_name }}.apk"
          cp "${apks[0]}" "$output"
          echo "apk=$output" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          generate_release_notes: true
          name: OpenParsec Quest 2 ${{ github.ref_name }}
          body: |
            ## OpenParsec Quest 2 ${{ github.ref_name }}

            Side-load `openparsec-quest2-${{ github.ref_name }}.apk` on a
            Quest 2 or compatible Android 9+ ARM64 device. The in-app update checker (polls this repo's
            `releases/latest` once per 24h) will notify users when a newer
            version is published here.
