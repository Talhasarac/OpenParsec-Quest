apply plugin: 'com.android.application'

android {
    namespace 'com.example.parsecdemo'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.openparsec.quest"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 8
        versionName "0.4.4-quest"
        setProperty("archivesBaseName", "openparsec-quest2-${versionName}")
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Quest 2 is ARM64-only. Keeping the APK single-ABI makes it
                // substantially smaller and prevents accidental installs on
                // Android devices this Quest-specific build does not target.
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            // Stable shared keystore committed at the repo root so every
            // release APK is signed with the SAME certificate. Without this
            // each CI runner generated a fresh ~/.android/debug.keystore and
            // released APKs failed update with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
            // The password is shared on purpose — this is the public sideload
            // identity, not a production Play Store key.
            storeFile file('../openparsec-release.keystore')
            storePassword 'openparsec'
            keyAlias 'openparsec'
            keyPassword 'openparsec'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['libs']
    }
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            (details.requested.name == 'kotlin-stdlib-jdk7' ||
             details.requested.name == 'kotlin-stdlib-jdk8' ||
             details.requested.name == 'kotlin-stdlib')) {
            details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}
