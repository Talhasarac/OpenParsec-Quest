apply plugin: 'com.android.application'

// Secrets are supplied by the maintainer's environment or GitHub Actions.
// Debug builds do not need release credentials.
def releaseSigning = [
    storeFile: System.getenv('OPENPARSEC_KEYSTORE_PATH'),
    storePassword: System.getenv('OPENPARSEC_STORE_PASSWORD'),
    keyAlias: System.getenv('OPENPARSEC_KEY_ALIAS'),
    keyPassword: System.getenv('OPENPARSEC_KEY_PASSWORD')
]

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Require private release credentials and reject the exposed signing key.'
    doLast {
        def missing = releaseSigning.findAll { key, value -> !value }.keySet()
        if (!missing.empty) {
            throw new GradleException("Missing release signing settings: ${missing.join(', ')}. See SIGNING.md.")
        }
        def keystoreFile = rootProject.file(releaseSigning.storeFile)
        if (!keystoreFile.isFile()) {
            throw new GradleException('Release keystore does not exist. See SIGNING.md.')
        }
        def keystore
        try {
            keystore = java.security.KeyStore.getInstance(keystoreFile, releaseSigning.storePassword.toCharArray())
            if (!keystore.isKeyEntry(releaseSigning.keyAlias)) {
                throw new GradleException('Release key alias must identify a private key. See SIGNING.md.')
            }
            if (!(keystore.getKey(releaseSigning.keyAlias, releaseSigning.keyPassword.toCharArray()) instanceof java.security.PrivateKey)) {
                throw new GradleException('Release key alias must identify a private key. See SIGNING.md.')
            }
        } catch (java.security.GeneralSecurityException | IOException ignored) {
            throw new GradleException('Cannot unlock release signing key. Check the keystore, alias and passwords. See SIGNING.md.')
        }
        // Compare the public key, so changing its password, alias or certificate
        // cannot make the permanently exposed private key trusted again.
        def publicKey = keystore.getCertificate(releaseSigning.keyAlias).publicKey.encoded
        def publicKeySha256 = java.security.MessageDigest.getInstance('SHA-256').digest(publicKey).encodeHex().toString()
        if (publicKeySha256 == '3cf67b3b09eb291c49627042778fdc6673e442e0969b81c3b1c673351bbaf2b1') {
            throw new GradleException('The public OpenParsec signing key is compromised and cannot sign releases. Generate a new private key; see SIGNING.md.')
        }
    }
}

// Cover APKs, bundles and direct signing tasks without blocking debug builds
// or IDE sync when the maintainer's credentials are unavailable.
tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'validateSigningRelease') {
        dependsOn verifyReleaseSigning
    }
}

android {
    namespace 'com.example.parsecdemo'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.openparsec.quest"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 14
        versionName "0.4.10-quest"
        setProperty("archivesBaseName", "openparsec-quest2-${versionName}")
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Quest 2 is ARM64-only. Keeping the APK single-ABI makes it
                // substantially smaller and prevents accidental installs on
                // Android devices this Quest-specific build does not target.
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            storeFile releaseSigning.storeFile ? rootProject.file(releaseSigning.storeFile) : null
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['libs']
    }
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            (details.requested.name == 'kotlin-stdlib-jdk7' ||
             details.requested.name == 'kotlin-stdlib-jdk8' ||
             details.requested.name == 'kotlin-stdlib')) {
            details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
